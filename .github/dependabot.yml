version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "[GHA] Dependabot:"
      prefix-development: "[GHA-dev] Dependabot:"
    pull-request-branch-name:
      separator: "-"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "[pip] Dependabot:"
      prefix-development: "[pip-dev] Dependabot:"
    pull-request-branch-name:
      separator: "-"
